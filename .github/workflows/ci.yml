name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: taskflow/api/package-lock.json
      - name: Install dependencies
        working-directory: ./taskflow/api
        run: npm ci
      - name: Lint
        working-directory: ./taskflow/api
        run: npm run lint
      - name: Test
        working-directory: ./taskflow/api
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: taskflow/web/package-lock.json
      - name: Install dependencies
        working-directory: ./taskflow/web
        run: npm ci
      - name: Lint
        working-directory: ./taskflow/web
        run: npm run lint
      - name: Test
        working-directory: ./taskflow/web
        run: npm test
      - name: Build
        working-directory: ./taskflow/web
        run: npm run build

  docker:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: docker compose -f taskflow/docker-compose.yml build