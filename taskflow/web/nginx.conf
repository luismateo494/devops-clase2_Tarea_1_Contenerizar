server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta de React Router (/tareas/12) devuelve index.html
  location / {
    try_files $uri /index.html;
  }

  # Archivos con hash de Vite: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
